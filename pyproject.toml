[project]
name = "python-code"
version = "0.1.0"
description = "Navigation and ML with magnet beacon"
readme = "README.md"
authors = [
    { name = "OneIn", email = "OneInSqrT@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",       # Rotation, quad (интеграл соленоида)
    "matplotlib>=3.8",   # визуализация
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",       # параллельный запуск
    "crosshair-tool>=0.0.100", # SDD+TDD контракты
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "--tb=short -q"

[tool.crosshair]
# если нужно глобально задать опции

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
